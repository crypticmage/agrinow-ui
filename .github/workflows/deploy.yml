name: 🚀 Full-Stack Deploy to cPanel (Node.js/Next.js)

on:
  push:
    branches:
      - main
      - stage
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Project
        run: pnpm run build

      # --- DEPLOY TO PRODUCTION (Main Branch) ---
      - name: 🌐 Deploy Prod
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/node_modules/**
            .github/**

      # --- DEPLOY TO STAGING (Stage Branch) ---
      - name: 🧪 Deploy Stage
        if: github.ref == 'refs/heads/stage'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_STAGE }}
          password: ${{ secrets.FTP_PASSWORD_STAGE }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/node_modules/**
            .github/**

      # --- DEPLOY TO DEV (Dev Branch) ---
      - name: 🏗️ Deploy Dev
        if: github.ref == 'refs/heads/dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/node_modules/**
            .github/**

      # --- TRIGGER RESTART (Universal) ---
      # This creates a restart.txt file which cPanel watches to reboot the app
      - name: 🔄 Signal Server Restart
        run: |
          mkdir -p tmp
          touch tmp/restart.txt
