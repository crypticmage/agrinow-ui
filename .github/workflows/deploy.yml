name: 🚀 Next.js Vercel-Style Deploy
on:
  push:
    branches: [main, stage, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Project
        run: pnpm run build

      - name: 📂 Sync to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          # This logic picks the right FTP user based on the branch
          username: ${{ github.ref == 'refs/heads/main' && secrets.FTP_PROD || (github.ref == 'refs/heads/stage' && secrets.FTP_STAGE || secrets.FTP_DEV) }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          dangerous-clean-slate: true
          exclude: |
            node_modules/
            .git/
            .github/
            .htaccess
            
      
      - name: 🔄 Restart Node App
        run: |
          mkdir -p tmp
          touch tmp/restart.txt
