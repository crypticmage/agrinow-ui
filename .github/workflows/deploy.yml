name: 🚀 Next.js Vercel-Style Deploy
on:
  push:
    branches: [main, stage, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Project
        run: pnpm run build

      - name: 🗜️ Assemble and zip standalone output
        run: |
          mkdir -p deploy

          # Standalone server + minimal node_modules (only runtime deps)
          cp .next/standalone/server.js   deploy/server.js
          cp .next/standalone/package.json deploy/package.json
          cp -r .next/standalone/node_modules deploy/node_modules
          cp -r .next/standalone/.next    deploy/.next

          # Static assets and public folder
          cp -r .next/static              deploy/.next/static
          cp -r public                    deploy/public

          zip -r deploy.zip deploy

      - name: 📤 Upload zip to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.zip
          target: ${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_PATH_PROD || (github.ref == 'refs/heads/stage' && secrets.DEPLOY_PATH_STAGE || secrets.DEPLOY_PATH_DEV) }}

      - name: 🔓 Unzip and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_PATH_PROD || (github.ref == 'refs/heads/stage' && secrets.DEPLOY_PATH_STAGE || secrets.DEPLOY_PATH_DEV) }}"
            cd "$DEPLOY_PATH"
            unzip -o deploy.zip
            rm -f deploy.zip
            cp -r deploy/* .
            rm -rf deploy
            mkdir -p tmp && touch tmp/restart.txt
