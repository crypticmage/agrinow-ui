name: 🚀 Build and Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
      - stage
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9  # Adjust version if you use a specific one locally

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Project
        run: pnpm run build

      # --- DEPLOY TO PRODUCTION ---
      - name: 🌐 Deploy Prod (Main Branch)
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          local-dir: ./out/
          server-dir: ./

      # --- DEPLOY TO STAGING ---
      - name: 🧪 Deploy Stage (Stage Branch)
        if: github.ref == 'refs/heads/stage'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_STAGE }}
          password: ${{ secrets.FTP_PASSWORD_STAGE }}
          local-dir: ./out/
          server-dir: ./

      # --- DEPLOY TO DEV ---
      - name: 🏗️ Deploy Dev (Dev Branch)
        if: github.ref == 'refs/heads/dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: ./out/
          server-dir: ./
