name: 🚀 Full-Stack Deploy to cPanel

on:
  push:
    branches: [main, dev, stage]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Project
        run: pnpm run build

      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_PROD }} # Use branch logic here like before
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          # We upload the source AND the built .next folder
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/node_modules/**
            .github/**

      # THIS STEP IS THE "VERCEL MAGIC" - It tells cPanel to refresh
      - name: 🔄 Restart Node.js App
        run: |
          echo "Restarting app..."
          # This creates a restart file that Passenger looks for
          # You might need a specific SSH command or a cPanel API call here 
          # depending on your host's restrictions.
